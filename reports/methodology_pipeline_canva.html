<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Methodology Pipeline</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #f7f6f2;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: 1600px;
      height: 900px;
      margin: 0 auto;
      background: #fbfaf7;
    }

    svg {
      display: block;
      width: 1600px;
      height: 900px;
    }
  </style>
</head>
<body>
  <main class="page">
    <svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
      <title id="title">Methodology pipeline</title>
      <desc id="desc">A four-stage pipeline: dense attribution graph, pruned graph, clustered graph, and final labeled summary.</desc>

      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6062"/>
        </marker>
        <marker id="arrow-brown" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b3735"/>
        </marker>
        <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#c16b2f"/>
        </marker>
        <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#302b28" flood-opacity="0.10"/>
        </filter>
        <style>
          .title { fill: #242220; font-size: 36px; font-weight: 700; letter-spacing: 0; }
          .subtitle { fill: #67635d; font-size: 18px; }
          .panel { fill: #ffffff; stroke: #d7d1c8; stroke-width: 1.4; rx: 18; filter: url(#soft-shadow); }
          .panel-title { fill: #2c2926; font-size: 23px; font-weight: 700; }
          .caption { fill: #5f5b56; font-size: 15px; }
          .small { fill: #4d4945; font-size: 14px; }
          .axis-label { fill: #2e2c2a; font-size: 18px; }
          .token { fill: #151515; font-size: 19px; }
          .dash { stroke: #bbb5ad; stroke-width: 1.8; stroke-dasharray: 5 8; }
          .faint-edge { fill: none; stroke: #b9b7b0; stroke-width: 1.15; opacity: 0.33; }
          .fainter-edge { fill: none; stroke: #cfcac3; stroke-width: 0.9; opacity: 0.42; }
          .kept-edge { fill: none; stroke: #6b3735; stroke-width: 5.2; opacity: 0.82; stroke-linecap: round; }
          .main-edge { fill: none; stroke: #6b3735; stroke-width: 2.6; opacity: 0.88; marker-end: url(#arrow-brown); }
          .edge { fill: none; stroke: #5f6062; stroke-width: 2.1; marker-end: url(#arrow); }
          .weak-edge { fill: none; stroke: #bab5ad; stroke-width: 1.6; stroke-dasharray: 4 6; marker-end: url(#arrow); opacity: 0.72; }
          .cycle-edge { fill: none; stroke: #c16b2f; stroke-width: 2.7; marker-end: url(#arrow-orange); }
          .removed-edge { fill: none; stroke: #c16b2f; stroke-width: 2.3; stroke-dasharray: 8 8; }
          .open-node { fill: #fbfaf7; stroke: #bcb8b0; stroke-width: 2.4; }
          .active-node { fill: #6b3735; stroke: #6b3735; stroke-width: 2; }
          .feature { fill: #ffffff; stroke: #33302d; stroke-width: 1.8; }
          .feature-faint { fill: #f3f1ed; stroke: #cfc9c0; stroke-width: 1.8; }
          .embed { fill: #eee4ff; stroke: #6d4aa0; stroke-width: 1.7; }
          .error { fill: #f7ddd9; stroke: #a74336; stroke-width: 1.8; }
          .logit { fill: #242220; stroke: #242220; stroke-width: 1; }
          .logit-text { fill: #ffffff; font-size: 15px; font-weight: 700; }
          .supernode { fill: #dff5f3; stroke: #1c7775; stroke-width: 2; }
          .label-node { fill: #e1f5f2; stroke: #1c7775; stroke-width: 2; }
          .note { fill: #a75b27; font-size: 13px; font-weight: 700; }
          .stage-arrow { fill: none; stroke: #5f6062; stroke-width: 3.5; marker-end: url(#arrow); }
        </style>
      </defs>

      <rect x="0" y="0" width="1600" height="900" fill="#fbfaf7"/>
      <text class="title" x="64" y="70">Methodology pipeline</text>
      <text class="subtitle" x="64" y="104">Dense attribution graph to pruned, clustered, labeled causal summary</text>

      <g transform="translate(42 142)">
        <rect class="panel" x="0" y="0" width="610" height="650"/>
        <text class="panel-title" x="28" y="45">1. Dense attribution graph</text>
        <text class="caption" x="28" y="70">Token-layer graph with many faint causal pathways and a few dominant routes.</text>

        <g transform="translate(42 76)">
          <line class="dash" x1="0" y1="452" x2="500" y2="452"/>
          <line class="dash" x1="0" y1="365" x2="500" y2="365"/>
          <line class="dash" x1="0" y1="215" x2="500" y2="215"/>
          <line class="dash" x1="0" y1="65" x2="500" y2="65"/>

          <text class="axis-label" x="520" y="70">Layer 3</text>
          <text class="axis-label" x="520" y="220">Layer 2</text>
          <text class="axis-label" x="520" y="370">Layer 1</text>
          <text class="axis-label" x="520" y="457">Embeddings</text>
          <text class="axis-label" x="520" y="20">Output</text>

          <text class="token" x="0" y="510">Token 1</text>
          <text class="token" x="134" y="510">Token 2</text>
          <text class="token" x="268" y="510">Token 3</text>
          <text class="token" x="402" y="510">Token 4</text>

          <g>
            <path class="fainter-edge" d="M22 452 C26 385, 20 310, 22 215"/>
            <path class="fainter-edge" d="M45 452 C60 398, 40 325, 22 215"/>
            <path class="fainter-edge" d="M22 365 C62 315, 83 270, 150 215"/>
            <path class="fainter-edge" d="M44 365 C84 313, 85 265, 170 215"/>
            <path class="fainter-edge" d="M155 452 C172 370, 168 305, 166 215"/>
            <path class="fainter-edge" d="M170 365 C185 310, 176 260, 166 215"/>
            <path class="fainter-edge" d="M178 365 C250 312, 285 270, 330 215"/>
            <path class="fainter-edge" d="M198 365 C282 310, 342 270, 465 215"/>
            <path class="fainter-edge" d="M330 452 C340 370, 352 300, 330 215"/>
            <path class="fainter-edge" d="M355 365 C384 300, 410 255, 465 215"/>
            <path class="fainter-edge" d="M465 452 C468 375, 470 295, 465 215"/>
            <path class="fainter-edge" d="M465 365 C482 298, 496 180, 498 5"/>
            <path class="fainter-edge" d="M22 215 C88 150, 145 96, 166 65"/>
            <path class="fainter-edge" d="M45 365 C110 245, 225 145, 465 65"/>
            <path class="fainter-edge" d="M170 215 C230 160, 295 105, 465 65"/>
            <path class="fainter-edge" d="M330 215 C378 154, 420 98, 465 65"/>
            <path class="fainter-edge" d="M465 215 C478 160, 490 95, 498 5"/>
            <path class="fainter-edge" d="M166 65 C260 55, 365 38, 498 5"/>
            <path class="fainter-edge" d="M465 65 C488 52, 496 25, 498 5"/>
          </g>

          <g>
            <path class="kept-edge" d="M22 452 C72 417, 80 365, 44 365 C20 335, 20 260, 22 215 C30 145, 34 80, 44 65 C150 55, 330 35, 498 5"/>
            <path class="kept-edge" d="M166 452 C212 415, 197 378, 198 365 C242 318, 302 292, 330 215 C333 171, 367 125, 465 65"/>
            <path class="kept-edge" d="M330 452 C365 420, 352 382, 354 365 C360 300, 360 245, 354 215 C371 150, 416 93, 465 65"/>
            <path class="kept-edge" d="M465 452 C488 420, 495 375, 465 365 C470 275, 470 160, 498 5"/>
          </g>

          <circle class="active-node" cx="22" cy="452" r="10"/>
          <circle class="open-node" cx="45" cy="452" r="10"/>
          <circle class="open-node" cx="166" cy="452" r="10"/>
          <circle class="active-node" cx="330" cy="452" r="10"/>
          <circle class="active-node" cx="465" cy="452" r="10"/>

          <circle class="open-node" cx="22" cy="365" r="10"/>
          <circle class="active-node" cx="44" cy="365" r="10"/>
          <circle class="open-node" cx="155" cy="365" r="10"/>
          <circle class="open-node" cx="178" cy="365" r="10"/>
          <circle class="active-node" cx="198" cy="365" r="10"/>
          <circle class="open-node" cx="330" cy="365" r="10"/>
          <circle class="active-node" cx="354" cy="365" r="10"/>
          <circle class="open-node" cx="382" cy="365" r="10"/>
          <circle class="open-node" cx="445" cy="365" r="10"/>
          <circle class="active-node" cx="465" cy="365" r="10"/>

          <circle class="open-node" cx="22" cy="215" r="10"/>
          <circle class="open-node" cx="166" cy="215" r="10"/>
          <circle class="open-node" cx="190" cy="215" r="10"/>
          <circle class="open-node" cx="218" cy="215" r="10"/>
          <circle class="open-node" cx="330" cy="215" r="10"/>
          <circle class="active-node" cx="354" cy="215" r="10"/>
          <circle class="open-node" cx="445" cy="215" r="10"/>
          <circle class="open-node" cx="465" cy="215" r="10"/>

          <circle class="open-node" cx="22" cy="65" r="10"/>
          <circle class="active-node" cx="44" cy="65" r="10"/>
          <circle class="open-node" cx="166" cy="65" r="10"/>
          <circle class="active-node" cx="465" cy="65" r="10"/>
          <circle class="open-node" cx="490" cy="65" r="10"/>
          <circle class="active-node" cx="498" cy="5" r="10"/>
        </g>
      </g>

      <path class="stage-arrow" d="M674 465 L724 465"/>

      <g transform="translate(742 142)">
        <rect class="panel" x="0" y="0" width="250" height="650"/>
        <text class="panel-title" x="22" y="45">2. Pruned graph</text>
        <text class="caption" x="22" y="70">Weak paths and error nodes are removed.</text>

        <g transform="translate(22 116)">
          <polygon class="embed" points="46,430 60,414 74,430 60,446"/>
          <polygon class="embed" points="158,430 172,414 186,430 172,446"/>
          <polygon class="error" points="30,275 45,301 15,301"/>
          <circle class="feature" cx="72" cy="330" r="16"/>
          <circle class="feature" cx="156" cy="324" r="16"/>
          <circle class="feature" cx="112" cy="214" r="16"/>
          <circle class="feature-faint" cx="50" cy="206" r="13"/>
          <circle class="feature-faint" cx="180" cy="202" r="13"/>
          <rect class="logit" x="78" y="40" width="72" height="32" rx="5"/>
          <text class="logit-text" x="92" y="61">Austin</text>

          <path class="edge" d="M60 414 L72 346"/>
          <path class="edge" d="M172 414 L156 340"/>
          <path class="edge" d="M72 314 L112 230"/>
          <path class="edge" d="M156 308 L112 230"/>
          <path class="edge" d="M112 198 L112 73"/>
          <path class="edge" d="M156 308 C184 240, 172 126, 150 72"/>
          <path class="weak-edge" d="M31 299 L64 318"/>
          <path class="weak-edge" d="M50 193 L102 204"/>
          <path class="weak-edge" d="M180 189 L145 74"/>
        </g>

        <text class="caption" x="22" y="596">Retain routes with direct influence on the target logit.</text>
      </g>

      <path class="stage-arrow" d="M1014 465 L1064 465"/>

      <g transform="translate(1082 142)">
        <rect class="panel" x="0" y="0" width="250" height="650"/>
        <text class="panel-title" x="22" y="45">3. Clustered graph</text>
        <text class="caption" x="22" y="70">Related features are grouped into supernodes.</text>

        <g transform="translate(22 114)">
          <polygon class="embed" points="44,432 58,416 72,432 58,448"/>
          <polygon class="embed" points="158,432 172,416 186,432 172,448"/>
          <ellipse class="supernode" cx="72" cy="318" rx="42" ry="30"/>
          <ellipse class="supernode" cx="154" cy="275" rx="42" ry="30"/>
          <ellipse class="supernode" cx="114" cy="154" rx="46" ry="30"/>
          <circle class="active-node" cx="52" cy="317" r="5"/>
          <circle class="active-node" cx="73" cy="302" r="5"/>
          <circle class="active-node" cx="92" cy="324" r="5"/>
          <circle class="active-node" cx="136" cy="274" r="5"/>
          <circle class="active-node" cx="154" cy="260" r="5"/>
          <circle class="active-node" cx="174" cy="280" r="5"/>
          <circle class="active-node" cx="96" cy="154" r="5"/>
          <circle class="active-node" cx="132" cy="154" r="5"/>
          <rect class="logit" x="78" y="40" width="72" height="32" rx="5"/>
          <text class="logit-text" x="92" y="61">Austin</text>

          <path class="edge" d="M58 416 L72 348"/>
          <path class="edge" d="M172 416 L154 305"/>
          <path class="cycle-edge" d="M107 304 C122 286, 128 281, 114 274"/>
          <path class="cycle-edge" d="M121 289 C108 305, 104 311, 115 316"/>
          <path class="edge" d="M82 291 L105 181"/>
          <path class="edge" d="M151 245 L125 181"/>
          <path class="edge" d="M114 124 L114 72"/>
          <text class="note" x="58" y="382">cycle found</text>
        </g>

        <text class="caption" x="22" y="596">Aggregation can introduce cycles that must be resolved.</text>
      </g>

      <path class="stage-arrow" d="M1354 465 L1404 465"/>

      <g transform="translate(1422 142)">
        <rect class="panel" x="0" y="0" width="136" height="650"/>
        <text class="panel-title" x="-2" y="45">4. Summary</text>

        <g transform="translate(6 116)">
          <polygon class="embed" points="22,430 36,414 50,430 36,446"/>
          <polygon class="embed" points="86,430 100,414 114,430 100,446"/>
          <text class="small" x="10" y="470">Dallas</text>
          <text class="small" x="76" y="470">capital</text>

          <rect class="label-node" x="2" y="298" width="68" height="48" rx="22"/>
          <text class="small" x="17" y="318">Texas</text>
          <text class="small" x="17" y="337">state</text>
          <rect class="label-node" x="70" y="298" width="68" height="48" rx="22"/>
          <text class="small" x="82" y="318">capital</text>
          <text class="small" x="86" y="337">query</text>
          <rect class="label-node" x="35" y="166" width="78" height="54" rx="25"/>
          <text class="small" x="48" y="188">answer</text>
          <text class="small" x="43" y="207">selection</text>
          <rect class="logit" x="39" y="40" width="72" height="32" rx="5"/>
          <text class="logit-text" x="53" y="61">Austin</text>

          <path class="edge" d="M36 414 L36 346"/>
          <path class="edge" d="M100 414 L104 346"/>
          <path class="edge" d="M55 298 L70 220"/>
          <path class="edge" d="M94 298 L79 220"/>
          <path class="edge" d="M74 166 L75 72"/>
          <path class="removed-edge" d="M103 299 C112 266, 106 242, 87 219"/>
          <text class="note" x="14" y="382">cycle edge</text>
          <text class="note" x="24" y="399">removed</text>
        </g>

        <text class="caption" x="14" y="596">Readable labels turn the graph into an inspectable causal story.</text>
      </g>

      <g transform="translate(64 820)">
        <circle class="active-node" cx="0" cy="0" r="9"/>
        <text class="small" x="16" y="5">dominant feature</text>
        <circle class="open-node" cx="170" cy="0" r="9"/>
        <text class="small" x="186" y="5">background feature</text>
        <polygon class="embed" points="374,0 388,-15 402,0 388,15"/>
        <text class="small" x="410" y="5">input token</text>
        <polygon class="error" points="564,-14 578,12 550,12"/>
        <text class="small" x="590" y="5">error node</text>
        <ellipse class="supernode" cx="760" cy="0" rx="34" ry="18"/>
        <text class="small" x="810" y="5">supernode</text>
        <line class="removed-edge" x1="1010" y1="0" x2="1068" y2="0"/>
        <text class="small" x="1084" y="5">removed cycle edge</text>
      </g>
    </svg>
  </main>
</body>
</html>
