[project]
name = "circuit-tracer"
version = "1.0.0"
description = "Library for circuit tracing in language models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "einops>=0.8.0",
    "entmax>=1.3",
    "fastapi>=0.115.0",
    "huggingface_hub<1.0.0",
    "ipykernel>=6.29.5,<7.0.0",
    "ipywidgets>=8.1.7",
    "nnsight>=0.5.13",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "safetensors>=0.5.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "seaborn>=0.13.2",
    "streamlit>=1.45.1",
    "requests>=2.31.0",
    "tokenizers>=0.21.0",
    "torch>=2.0.0",
    "openai>=1.0.0",
    "python-multipart>=0.0.9",
    "tqdm>=4.60.0",
    "transformer-lens>=2.16.0",
    "transformers>=4.56.0,<=4.57.3",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.12.7", "pyright>=1.1.403", "ipython>=8.37.0"]
viz = ["streamlit>=1.32.0"]

[project.scripts]
circuit-tracer = "circuit_tracer.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["circuit_tracer", "summarization", "visualization_app"]

[tool.hatch.build.targets.wheel.force-include]
"api.py" = "api.py"
"attribute_utils.py" = "attribute_utils.py"
"config.py" = "config.py"

[tool.hatch.build.targets.sdist]
include = [
    "/.github",
    "/.gitignore",
    "/LICENSE",
    "/README.md",
    "/api.py",
    "/attribute_utils.py",
    "/circuit_tracer",
    "/config.py",
    "/pyproject.toml",
    "/requirements.txt",
    "/summarization",
    "/visualization_app",
]

[tool.ruff]
line-length = 100
exclude = ["*.ipynb", "demos"]

[tool.ruff.lint]
ignore = ["E501"]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "TID", # flake8-tidy-imports (includes TID251 for banned-api)
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Union".msg = "Use `|` instead"
"typing.Optional".msg = "Use `| None` instead"
"typing.Dict".msg = "Use `dict` instead"
"typing.Tuple".msg = "Use `tuple` instead"
"typing.List".msg = "Use `list` instead"

[tool.pyright]
typeCheckingMode = "basic"
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "demos"]
reportArgumentType = false
reportAttributeAccessIssue = false
reportOperatorIssue = false
reportOptionalIterable = false
reportOptionalMemberAccess = false
reportOptionalSubscript = false
reportPrivateImportUsage = false
